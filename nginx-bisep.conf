# ═════════════════════════════════════════════════════════════════════
# BISE PESHAWAR ONLINE RESULTS SYSTEM — cloud.bisep.edu.pk
# NGINX server block: hardened security headers + performance
# Usage: include into nginx.conf / conf.d and reload nginx
# ═════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name cloud.bisep.edu.pk;

    # Redirect everything to HTTPS once TLS certificates are installed
    # return 301 https://$host$request_uri;

    root /var/www/cloud.bisep.edu.pk;
    index index.html;

    # ── SECURITY HEADERS ─────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; manifest-src 'self'; worker-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Enable after HTTPS is live:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Explicit green light for Google + AI crawlers (no accidental noindex)
    add_header X-Robots-Tag "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" always;

    # ── GZIP ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json text/xml application/xml;

    # ── CACHING ──────────────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* \.(png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
        try_files $uri =404;
    }

    # No dotfiles, no backups
    location ~ /\. { deny all; }
    location ~* \.(bak|config|sql|ini|log|sh|swp|dist)$ { deny all; }

    # Service worker must stay fresh
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SEO / AI crawler files — always fresh, never cached
    location = /robots.txt { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri =404; }
    location = /sitemap.xml { add_header Cache-Control "no-cache, must-revalidate"; add_header Content-Type "application/xml"; try_files $uri =404; }
    location = /llms.txt { add_header Cache-Control "no-cache, must-revalidate"; add_header Content-Type "text/plain"; try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
